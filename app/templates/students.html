{% extends "base.html" %}
{% block title %}Students - CampusShield{% endblock %}
{% block content %}
<h1>Student records ({{ rows|length }})</h1>
<table>
  <tr><th>ID</th><th>Name</th><th>Email</th><th>Programme</th><th>Year</th></tr>
  {% for r in rows %}
  <tr><td>{{ r.student_id }}</td><td>{{ r.full_name }}</td><td>{{ r.email }}</td><td>{{ r.programme }}</td><td>{{ r.year }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
