<!doctype html>
<html><head><meta charset="utf-8"><title>CampusShield Kali lab network</title>
<style>body{margin:0;background:#fff}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810">
<style>
  text { font-family: "Segoe UI", Arial, sans-serif; fill:#1d2433; font-size:14px; }
  .t { font-size:24px; font-weight:700; }
  .h { font-size:16px; font-weight:700; }
  .b { font-weight:700; }
  .w { fill:#ffffff; }
  .mono { font-family: Consolas, "Courier New", monospace; }
</style>
<rect width="1400" height="810" fill="#ffffff"/>
<text x="40" y="44" class="t">Kali lab network: zones, firewall policy and capture point</text>

<!-- VM boundary -->
<rect x="20" y="62" width="1360" height="668" rx="12" fill="none" stroke="#455a64" stroke-width="2" stroke-dasharray="10 6"/>
<text x="40" y="90" class="h" style="fill:#455a64">Kali Linux VM (VMware) — isolated lab; every test packet stays inside this VM</text>

<!-- untrusted namespace -->
<rect x="50" y="160" width="290" height="230" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="68" y="188" class="h" style="fill:#b71c1c">netns cs_untrusted</text>
<text x="68" y="210">unauthorized lab zone</text>
<text x="68" y="232" class="mono b">10.10.50.66/24</text>
<rect x="68" y="252" width="254" height="116" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
<text x="84" y="280" class="b">Scanner / attacker host</text>
<text x="84" y="304" class="mono">nmap -sV 10.10.50.1</text>
<text x="84" y="328">curl probes to :5000, :8000</text>
<text x="84" y="352">(not allowed to reach the app)</text>

<!-- staff namespace -->
<rect x="1060" y="160" width="290" height="230" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="1078" y="188" class="h" style="fill:#1b5e20">netns cs_staff</text>
<text x="1078" y="210">authorized lab zone</text>
<text x="1078" y="232" class="mono b">10.10.60.10/24</text>
<rect x="1078" y="252" width="254" height="116" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="1094" y="280" class="b">Registrar workstation</text>
<text x="1094" y="304">browser / curl to :5000</text>
<text x="1094" y="328">normal portal use</text>
<text x="1094" y="352">(allowed by firewall)</text>

<!-- root namespace -->
<rect x="470" y="112" width="460" height="580" rx="10" fill="#f5f6f8" stroke="#78909c" stroke-width="2"/>
<text x="490" y="140" class="h" style="fill:#37474f">Kali root namespace (host side)</text>
<text x="490" y="162">veth host ends, services and iptables</text>

<rect x="500" y="182" width="400" height="80" rx="8" fill="#1f4e79"/>
<text x="520" y="214" class="b w" style="font-size:15px">CampusShield portal — tcp/5000</text>
<text x="520" y="240" class="w">Flask app (the one service we need)</text>

<rect x="500" y="282" width="400" height="92" rx="8" fill="#eeeeee" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="500" y1="282" x2="900" y2="374" stroke="#c62828" stroke-width="3" opacity="0.2"/>
<line x1="900" y1="282" x2="500" y2="374" stroke="#c62828" stroke-width="3" opacity="0.2"/>
<text x="520" y="310" class="b" style="fill:#616161;font-size:15px">Backup share — tcp/8000</text>
<text x="520" y="333" class="mono" style="fill:#616161">python3 -m http.server (before)</text>
<text x="520" y="358" class="b" style="fill:#c62828">Stopped during hardening</text>

<rect x="500" y="394" width="400" height="200" rx="8" fill="#fff3e0" stroke="#e07b00" stroke-width="2"/>
<text x="520" y="422" class="b" style="font-size:15px;fill:#b35c00">iptables INPUT policy (after hardening)</text>
<rect x="520" y="436" width="64" height="22" rx="4" fill="#2e7d32"/>
<text x="552" y="452" text-anchor="middle" class="b w">ALLOW</text>
<text x="596" y="452" class="mono">10.10.60.0/24 → tcp/5000</text>
<rect x="520" y="468" width="64" height="22" rx="4" fill="#c62828"/>
<text x="552" y="484" text-anchor="middle" class="b w">DROP</text>
<text x="596" y="484">+ LOG all other inbound traffic</text>
<text x="596" y="504">arriving on cs-untr-h / cs-staff-h</text>
<text x="520" y="536">rules match only the lab veth interfaces,</text>
<text x="520" y="556">so the VM's own network card is untouched;</text>
<text x="520" y="576">rules are applied, re-tested, then removed</text>

<text x="490" y="630" class="b" style="fill:#37474f">Scope: no traffic leaves the VM; no Internet scanning.</text>
<text x="490" y="652">Zones are Linux network namespaces joined by veth pairs.</text>
<text x="490" y="674">Evidence from each step is saved under evidence/.</text>

<!-- links -->
<line x1="340" y1="290" x2="470" y2="290" stroke="#c62828" stroke-width="4"/>
<text x="405" y="254" text-anchor="middle" class="mono b">cs-untr-h</text>
<text x="405" y="272" text-anchor="middle" class="mono">10.10.50.1</text>
<text x="405" y="316" text-anchor="middle" style="fill:#b71c1c">veth link</text>

<line x1="930" y1="290" x2="1060" y2="290" stroke="#2e7d32" stroke-width="4"/>
<text x="995" y="254" text-anchor="middle" class="mono b">cs-staff-h</text>
<text x="995" y="272" text-anchor="middle" class="mono">10.10.60.1</text>
<circle cx="995" cy="290" r="9" fill="#e07b00" stroke="#ffffff" stroke-width="2"/>
<polyline points="995,300 995,475 1058,475" fill="none" stroke="#e07b00" stroke-width="2" stroke-dasharray="6 4"/>

<rect x="1060" y="420" width="290" height="112" rx="8" fill="#fff3e0" stroke="#e07b00" stroke-width="2"/>
<text x="1078" y="448" class="b" style="fill:#b35c00;font-size:15px">Capture point</text>
<text x="1078" y="472" class="mono">tshark -i cs-staff-h</text>
<text x="1078" y="496">HTTP vs HTTPS login traffic</text>
<text x="1078" y="518">saved as .pcap in evidence/</text>

<!-- expected outcomes -->
<rect x="50" y="420" width="390" height="200" rx="10" fill="#ffffff" stroke="#78909c" stroke-width="1.5"/>
<text x="68" y="448" class="b" style="font-size:15px">Intended outcome (checked with nmap/curl)</text>
<text x="68" y="490" class="mono">cs_staff → :5000</text>
<rect x="300" y="472" width="120" height="26" rx="13" fill="#2e7d32"/>
<text x="360" y="490" text-anchor="middle" class="b w">allowed</text>
<text x="68" y="534" class="mono">cs_untrusted → :5000</text>
<rect x="300" y="516" width="120" height="26" rx="13" fill="#c62828"/>
<text x="360" y="534" text-anchor="middle" class="b w">filtered</text>
<text x="68" y="578" class="mono">any zone → :8000</text>
<rect x="300" y="560" width="120" height="26" rx="13" fill="#757575"/>
<text x="360" y="578" text-anchor="middle" class="b w">closed</text>

<!-- legend -->
<rect x="40" y="752" width="24" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="72" y="766">Authorized zone</text>
<rect x="220" y="752" width="24" height="16" rx="3" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="252" y="766">Unauthorized zone</text>
<rect x="420" y="752" width="24" height="16" rx="3" fill="#1f4e79"/>
<text x="452" y="766">Required application service</text>
<rect x="680" y="752" width="24" height="16" rx="3" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="712" y="766">Removed service</text>
<rect x="870" y="752" width="24" height="16" rx="3" fill="#fff3e0" stroke="#e07b00" stroke-width="1.5"/>
<text x="902" y="766">Firewall policy / capture point</text>
<rect x="1150" y="752" width="24" height="16" rx="3" fill="#f5f6f8" stroke="#78909c" stroke-width="1.5"/>
<text x="1182" y="766">OS / infrastructure</text>
</svg>
</body></html>
